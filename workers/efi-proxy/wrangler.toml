name = "nsmusic-efi-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Domínio próprio em vez do workers.dev compartilhado — o workers.dev demonstrou instabilidade
# intermitente (respostas 500 sem exceção/log nenhum do lado do Worker) durante os testes de
# 2026-08-02, provavelmente alguma política de rate-limit/anti-abuso do subdomínio compartilhado.
routes = [
  { pattern = "efi-proxy.nsnexus.com.br", custom_domain = true }
]

# Certificado mTLS exigido pela API Pix da Efí em toda chamada. Sandbox e produção são
# certificados/aplicações diferentes na Efí, então cada ambiente tem seu próprio binding — o
# worker escolhe qual usar com base no campo `env` ("sandbox"/"production") de cada requisição
# (ver src/worker.js). Subir com:
#   npx wrangler mtls-certificate upload --cert cert.pem --key key.pem --name efi-pix-sandbox
# (ou --name efi-pix-production para o de produção) e colar o `certificate_id` retornado abaixo
# (ver docs/EFI_SETUP.md). Prefira um certificado com serial number positivo (`openssl x509 -in
# cert.pem -noout -text | grep -A1 "Serial Number"`) quando possível — mas em 14/08/2026 a Cloudflare
# aceitou o upload de 3 certificados com serial negativo sem erro (o bloqueio 1408 documentado em
# 02/08 não se repetiu), e trocar para um com serial positivo não resolveu o bloqueio 403 da Efí
# (WAF bloqueando o IP do Worker, não relacionado ao certificado — ver docs/EFI_SETUP.md).
[[mtls_certificates]]
binding = "EFI_MTLS_CERT_SANDBOX"
certificate_id = "c8facf26-086e-455e-8faa-52c9a456be18"

[[mtls_certificates]]
binding = "EFI_MTLS_CERT_PRODUCTION"
certificate_id = "5bba60d5-7047-4e5b-9607-3641b86a1c35"

# Dois agendamentos (handler `scheduled` em src/worker.js, que distingue pelo event.cron). Moram
# aqui e não no app porque Cloudflare Pages não suporta cron trigger — só Workers suportam, a mesma
# limitação que já obrigou este Worker a existir.
#   */10 * * * *        — a cada 10min, chama POST /api/orders/reconcile: recupera música já pronta
#                         na Kie.ai e pagamento já confirmado na Efí que ficaram presos porque o
#                         cliente fechou a aba antes do polling terminar.
#   7,22,37,52 * * * *  — a cada 15min (minuto 7, fora de :00, ver .claude convenção de evitar minuto
#                         cheio), chama GET /api/cron/recover: régua de recuperação de carrinho via
#                         WhatsApp (só estágio de 4h desde 24/08/2026 — ver incidente de banimento no
#                         AUDIT/histórico do commit). Rodava 1x/hora com lote de até 20 mensagens;
#                         agora roda 4x mais vezes com lote de até 4, pra espalhar o envio no tempo em
#                         vez de mandar tudo em rajada — bate menos com padrão de bot pro WhatsApp.
[triggers]
crons = ["*/10 * * * *", "7,22,37,52 * * * *"]

# URL pública do app Next.js chamado pelos crons acima. Não é segredo.
[vars]
APP_URL = "https://nsmusic.nsnexus.com.br"

# EFI_PROXY_SECRET, RECONCILE_SECRET e CRON_SECRET são secrets, não vars: configurar com
#   npx wrangler secret put EFI_PROXY_SECRET --config workers/efi-proxy/wrangler.toml
#   npx wrangler secret put RECONCILE_SECRET --config workers/efi-proxy/wrangler.toml
#   npx wrangler secret put CRON_SECRET --config workers/efi-proxy/wrangler.toml
# RECONCILE_SECRET e CRON_SECRET precisam ter o MESMO valor configurado como variável de ambiente do
# app no Cloudflare Pages — é o que autoriza os crons a chamar as rotas sem uma conta de usuário.
# Nunca colocar os valores aqui.
