name = "nsmusic-efi-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Domínio próprio em vez do workers.dev compartilhado — o workers.dev demonstrou instabilidade
# intermitente (respostas 500 sem exceção/log nenhum do lado do Worker) durante os testes de
# 2026-08-02, provavelmente alguma política de rate-limit/anti-abuso do subdomínio compartilhado.
routes = [
  { pattern = "efi-proxy.nsnexus.com.br", custom_domain = true }
]

# Certificado mTLS exigido pela API Pix da Efí em toda chamada. Sandbox e produção são
# certificados/aplicações diferentes na Efí, então cada ambiente tem seu próprio binding — o
# worker escolhe qual usar com base no campo `env` ("sandbox"/"production") de cada requisição
# (ver src/worker.js). Subir com:
#   npx wrangler mtls-certificate upload --cert cert.pem --key key.pem --name efi-pix-sandbox
# (ou --name efi-pix-production para o de produção) e colar o `certificate_id` retornado abaixo
# (ver docs/EFI_SETUP.md). CUIDADO: confira antes que o certificado não tenha serial number
# negativo (`openssl x509 -in cert.pem -noout -text | grep -A1 "Serial Number"`) — a Cloudflare
# rejeita esse tipo de certificado no upload.
[[mtls_certificates]]
binding = "EFI_MTLS_CERT_SANDBOX"
certificate_id = "c8facf26-086e-455e-8faa-52c9a456be18"

[[mtls_certificates]]
binding = "EFI_MTLS_CERT_PRODUCTION"
certificate_id = "1f978a7b-f5f2-42e2-9e3f-a17e91c9ae78"

# Reconciliação agendada de pedidos travados (handler `scheduled` em src/worker.js). Mora aqui e não
# no app porque Cloudflare Pages não suporta cron trigger — só Workers suportam, a mesma limitação
# que já obrigou este Worker a existir. A cada 10 minutos ele chama POST /api/orders/reconcile no
# app, que recupera música já pronta na Kie.ai e pagamento já confirmado na Efí que ficaram presos
# porque o cliente fechou a aba antes do polling terminar.
[triggers]
crons = ["*/10 * * * *"]

# URL pública do app Next.js chamado pela reconciliação agendada. Não é segredo.
[vars]
APP_URL = "https://nsmusic.nsnexus.com.br"

# EFI_PROXY_SECRET e RECONCILE_SECRET são secrets, não vars: configurar com
#   npx wrangler secret put EFI_PROXY_SECRET --config workers/efi-proxy/wrangler.toml
#   npx wrangler secret put RECONCILE_SECRET --config workers/efi-proxy/wrangler.toml
# RECONCILE_SECRET precisa ter o MESMO valor configurado como variável de ambiente do app no
# Cloudflare Pages — é ele que autoriza o cron a chamar a rota sem uma conta de usuário.
# Nunca colocar os valores aqui.
