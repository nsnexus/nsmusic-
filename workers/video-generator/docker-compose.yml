services:
  video-generator:
    build: .
    container_name: nsmusic-video-generator
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file:
      - .env
    volumes:
      - /tmp/video-jobs:/tmp/video-jobs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3100/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
