name: Lembrete automático de pagamento

# Dispara /api/whatsapp/payment-reminders a cada 30 minutos para enviar o lembrete de pagamento
# (6h e 12h depois da música ficar pronta, se o pedido continuar sem pagamento aprovado) — substitui
# a campanha manual de recuperação removida em 2026-08-07. Mesmo motivo do daily-sales-report.yml:
# Cloudflare Pages não tem cron nativo (só Workers têm Cron Trigger).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    # REMINDERS_CRON_SECRET como Environment secret (mesmo padrão do daily-sales-report.yml) — sem
    # declarar o environment aqui, o job não enxerga o secret.
    environment: REMINDERS_CRON_SECRET
    steps:
      - name: Chamar /api/whatsapp/payment-reminders
        run: |
          curl --fail --silent --show-error \
            "https://nsmusic.nsnexus.com.br/api/whatsapp/payment-reminders?secret=${{ secrets.REMINDERS_CRON_SECRET }}"
